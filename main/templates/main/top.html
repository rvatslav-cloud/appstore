{% extends 'main/base.html' %}

{% block title %}Топ по цене{% endblock %}

{% block content %}
    <p><a href="{% url 'main:index' %}"> <- На главную</a></p>
    <h2>Топ по цене (самые дорогие)</h2>

    {% for app in apps %}
        <p><a href="{{ app.get_absolute_url }}">{{ app.name }}</a> — {{ app.price_label }}</p>
    {% empty %}
        <p>Платных приложений пока нет</p>
    {% endfor %}

{% endblock %}
